# -------------------------------------------------------------------
# Hardcoded AWS Credentials — Intentionally Vulnerable
#
# These resources contain FAKE AWS credentials that follow the real
# AWS key format. MKAT's `find-secrets` command scans ConfigMaps,
# Secrets, and Pods for paired Access Key IDs (AKIA*) and Secret
# Access Keys. It only flags a resource when BOTH are present in
# the same object, keeping false positives near zero.
#
# ⚠️  ALL CREDENTIALS BELOW ARE FAKE EXAMPLE VALUES — they will not
#     authenticate to any AWS account. They are crafted to trigger
#     MKAT's regex detection patterns for demonstration purposes.
# -------------------------------------------------------------------

# ConfigMap 1 — Legacy application config with hardcoded AWS credentials.
# Simulates a team that copy-pasted IAM user keys into a configmap
# instead of using IRSA or Pod Identity.
# MKAT flags: "Found AWS credentials in ConfigMap legacy-app-config (mkat-demo)"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-app-config
  namespace: mkat-demo
  labels:
    app: mkat-demo
    component: configmap
    security: vulnerable
data:
  AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
  AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  AWS_DEFAULT_REGION: "us-east-1"
  APP_NAME: "legacy-data-processor"

# ConfigMap 2 — Backup cron job configuration with a second set of
# hardcoded credentials. Demonstrates that MKAT catches multiple
# credential pairs across different resources.
# MKAT flags: "Found AWS credentials in ConfigMap backup-cron-config (mkat-demo)"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-cron-config
  namespace: mkat-demo
  labels:
    app: mkat-demo
    component: configmap
    security: vulnerable
data:
  BACKUP_BUCKET: "company-backups-prod"
  BACKUP_AWS_KEY: "AKIAI44QH8DHBEXAMPLE"
  BACKUP_AWS_SECRET: "je7MtGbClwBF/2Zp9Utk/h3yCo8nvbEXAMPLEKEY"
  BACKUP_SCHEDULE: "0 2 * * *"

# Kubernetes Secret — Database credentials with AWS keys smuggled in.
# MKAT decodes the base64 values and detects the AKIA* pattern inside.
# MKAT flags: "Found AWS credentials in Secret database-credentials (mkat-demo)"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: mkat-demo
  labels:
    app: mkat-demo
    component: secret
    security: vulnerable
type: Opaque
stringData:
  db_host: "prod-db.cluster-abc123.us-east-1.rds.amazonaws.com"
  db_user: "admin"
  db_password: "SuperS3cretP@ssw0rd!"
  aws_access_key_id: "AKIAYRJXG5BB6EXAMPLE"
  aws_secret_access_key: "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"

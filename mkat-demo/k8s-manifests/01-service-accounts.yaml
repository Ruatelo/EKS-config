# -------------------------------------------------------------------
# Service Accounts for MKAT Demo
#
# Five SAs demonstrating different IAM credential delivery mechanisms:
#   - IRSA (secure, no-sub, wildcard)
#   - EKS Pod Identity (secure, wildcard)
#
# After running `terraform apply`, replace the <REPLACE_WITH_...>
# placeholders with the actual role ARNs from terraform output.
# -------------------------------------------------------------------

# IRSA — SECURE
# This SA is annotated with a role whose trust policy uses StringEquals
# and restricts to exactly this service account. MKAT will report this
# association as properly configured.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader-sa
  namespace: mkat-demo
  annotations:
    eks.amazonaws.com/role-arn: "<REPLACE_WITH_SECURE_IRSA_ROLE_ARN>"
  labels:
    app: mkat-demo
    component: service-account
    security: secure
    mechanism: irsa

# IRSA — VULNERABLE (missing sub condition)
# The IAM role's trust policy only checks the OIDC audience but does NOT
# include a `sub` condition. Any pod in the entire cluster can project a
# token and assume this role.
# MKAT flags: "Role assumable by any service account (no sub condition)"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-vulnerable-sa
  namespace: mkat-demo
  annotations:
    eks.amazonaws.com/role-arn: "<REPLACE_WITH_VULNERABLE_IRSA_NO_SUB_ROLE_ARN>"
  labels:
    app: mkat-demo
    component: service-account
    security: vulnerable
    mechanism: irsa

# IRSA — VULNERABLE (wildcard sub condition)
# The IAM role's trust policy uses StringLike with a wildcard:
#   system:serviceaccount:mkat-demo:*
# Any SA in the mkat-demo namespace can assume this role, not just the
# intended one. Combined with S3FullAccess, this is a privilege escalation path.
# MKAT flags: "Role assumable by any SA in namespace mkat-demo (wildcard sub)"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-wildcard-sa
  namespace: mkat-demo
  annotations:
    eks.amazonaws.com/role-arn: "<REPLACE_WITH_VULNERABLE_IRSA_WILDCARD_ROLE_ARN>"
  labels:
    app: mkat-demo
    component: service-account
    security: vulnerable
    mechanism: irsa

# Pod Identity — SECURE
# Associated via EKS Pod Identity (terraform aws_eks_pod_identity_association)
# to a specific service account name. No IRSA annotation needed — credentials
# are delivered via the Pod Identity Agent DaemonSet on the node (169.254.170.23).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynamo-reader-sa
  namespace: mkat-demo
  labels:
    app: mkat-demo
    component: service-account
    security: secure
    mechanism: pod-identity

# Pod Identity — VULNERABLE (default SA association)
# The terraform creates a Pod Identity association on the `default` service
# account in the mkat-demo namespace. This means every pod that doesn't
# explicitly set a serviceAccountName gets SecretsManagerReadWrite access.
# This SA exists alongside `default` to show the contrast — but MKAT will
# flag the `default` SA association as overprivileged.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-manager-sa
  namespace: mkat-demo
  labels:
    app: mkat-demo
    component: service-account
    security: vulnerable
    mechanism: pod-identity

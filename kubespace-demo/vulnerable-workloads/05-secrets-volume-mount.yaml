# Pod that mounts the host's Kubernetes PKI directory into the container.
# Contains CA certificates, API server certs, and private keys.
# An attacker with access to these can forge kubeconfigs or impersonate the API server.
# Kubescape should flag: C-0044 (hostPath mount), sensitive path exposure.
apiVersion: v1
kind: Pod
metadata:
  name: secrets-stealer
  namespace: insecure-apps
  labels:
    app: secrets-stealer
    risk: high
spec:
  containers:
    - name: stealer
      image: busybox:latest
      command: ["sleep", "3600"]
      volumeMounts:
        - name: k8s-pki
          mountPath: /stolen-certs
        - name: host-etc
          mountPath: /host-etc
  volumes:
    - name: k8s-pki
      hostPath:
        path: /etc/kubernetes/pki
        type: DirectoryOrCreate
    - name: host-etc
      hostPath:
        path: /etc
        type: Directory

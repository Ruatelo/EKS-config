apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: blockprivesc
spec:
  crd:
    spec:
      names:
        kind: BlockPrivesc
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package block_privesc

        # Rule 1: Block privileged containers
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged == true
          msg := sprintf("Privileged containers are not allowed: %s", [container.name])
        }

        # Rule 2: Block containers that add any capabilities
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          count(container.securityContext.capabilities.add) > 0
          msg := sprintf("Adding capabilities is not allowed on container %s: %v", [container.name, container.securityContext.capabilities.add])
        }

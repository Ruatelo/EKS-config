# dev-sa gets full wildcard access to ALL resources with ALL verbs cluster-wide.
# This is intentionally overly permissive — rbac-tool should flag this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-sa-full-access
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-sa-full-access-binding
subjects:
  - kind: ServiceAccount
    name: dev-sa
    namespace: dev
roleRef:
  kind: ClusterRole
  name: dev-sa-full-access
  apiGroup: rbac.authorization.k8s.io
